name: EAS Preview Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Le contexte `secrets` n'est pas accessible dans un `if:` de job : on l'expose
    # via env pour pouvoir conditionner les étapes.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check EAS credentials
        id: creds
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=EAS build ignoré::Le secret EXPO_TOKEN n'est pas configuré, le build EAS est ignoré. Pour l'activer : gh secret set EXPO_TOKEN"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        if: steps.creds.outputs.present == 'true'
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Preview Build (iOS + Android)
        if: steps.creds.outputs.present == 'true'
        run: eas build --platform all --profile preview --non-interactive
